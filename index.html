<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PT-P700 Label Studio</title>
<style>body{font-family:system-ui,sans-serif;background:#f3f5f9;color:#203047;margin:0}header{background:#12345a;color:white;padding:22px}main{max-width:900px;margin:24px auto;padding:0 16px}.card{background:white;border-radius:14px;padding:24px;margin:14px 0;box-shadow:0 2px 12px #dde2ea}label{display:block;margin:14px 0 6px;font-weight:600}input,select,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bac8d5;border-radius:8px;font:inherit}button{border:0;border-radius:8px;padding:12px 16px;background:#1859a7;color:white;font:inherit;cursor:pointer;margin:8px 8px 0 0}button.secondary{background:#526477}canvas{max-width:100%;border:1px solid #888;background:white}.note{color:#5a6c7e;font-size:14px}#status{white-space:pre-wrap}</style>
</head><body><header><h1>Brother PT-P700 · Web Label Studio</h1><div>GitHub Pages 웹 편집기 · Ubuntu USB 직접 인쇄</div></header>
<main><section class="card"><label for="labeltext">라벨 내용</label><textarea id="labeltext" rows="3">FPGA · Basys3</textarea>
<label for="tape">테이프 폭</label><select id="tape"><option value="6">6 mm</option><option value="9">9 mm</option><option value="12">12 mm</option><option value="18">18 mm</option><option value="24" selected>24 mm</option></select>
<label for="font">글자 크기</label><input id="font" type="range" min="12" max="70" value="32">
<label for="length">라벨 길이 (mm)</label><input id="length" type="number" min="25" max="300" value="75">
<label for="bold">굵게 표시</label><input id="bold" type="checkbox" checked style="width:auto"></section>
<section class="card"><h2>미리보기</h2><canvas id="preview" width="512" height="128"></canvas><p class="note">열전사 인쇄용 흑백 이미지 미리보기입니다. 실제 출력 방향 및 여백은 프린터에서 검증해야 합니다.</p>
<button id="save">PNG 저장</button><button id="print">PT-P700 인쇄</button><p id="status" role="status"></p></section>
<section class="card"><h2>연결 방식</h2><p>GitHub Pages는 편집 화면을 제공하고, Ubuntu에서는 <code>bridge.py</code>를 실행해 로컬 USB 프린터로 출력합니다.</p><p class="note">인쇄 전 Ubuntu에서 ptouch-print 설치 및 프린터 인식이 필요합니다. 로컬 서버는 127.0.0.1:8765에서만 실행하세요.</p></section></main>
<script>
const $=id=>document.getElementById(id), heights={6:32,9:48,12:70,18:112,24:128},canvas=$('preview'),ctx=canvas.getContext('2d');
function draw(){const width=Number($('tape').value),height=heights[width],length=Math.max(25,Math.min(300,Number($('length').value)||75));canvas.width=Math.round(length*180/25.4);canvas.height=height;ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,height);ctx.fillStyle='#000';const size=Math.min(Number($('font').value),Math.max(12,height-8));ctx.font=( $('bold').checked?'bold ':'')+size+'px sans-serif';ctx.textBaseline='middle';const lines=$('labeltext').value.split('\n').slice(0,4);const lineHeight=Math.min(size+3,height/lines.length);lines.forEach((line,i)=>ctx.fillText(line,8,height/2+(i-(lines.length-1)/2)*lineHeight,canvas.width-16))}
['labeltext','tape','font','length','bold'].forEach(id=>$(id).addEventListener('input',draw));draw();
$('save').onclick=()=>{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='pt-p700-label.png';a.click()};
$('print').onclick=async()=>{const s=$('status');s.textContent='Ubuntu 로컬 인쇄 서버에 연결 중...';try{const r=await fetch('http://127.0.0.1:8765/print',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tape_width_mm:Number($('tape').value),png:canvas.toDataURL('image/png')})});const j=await r.json();s.textContent=j.ok?'인쇄 명령을 전송했습니다.':'인쇄 실패: '+(j.error||r.status)}catch(e){s.textContent='로컬 인쇄 서버 연결 실패: '+e.message+' (Ubuntu에서 bridge.py 실행 여부 확인)'}};
</script></body></html>
